services:
  postgres:
    image: postgres:16
    container_name: agentcart-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: agentcart
      POSTGRES_PASSWORD: agentcart_dev_password
      POSTGRES_DB: agentcart

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: